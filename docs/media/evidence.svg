<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <rect width="760" height="340" fill="#ffffff"/>
  <polygon points="612,175 60,-82 60,432" fill="#f3f3f3"/>
  <line x1="40" y1="20" x2="40" y2="290" stroke="#9e9e9e" stroke-width="6"/>
  <line x1="40" y1="290" x2="600" y2="290" stroke="#9e9e9e" stroke-width="6"/>
  <g transform="translate(640,175)">
    <polygon points="-28,0 0,-14 0,14" fill="#424242"/>
    <rect x="0" y="-12" width="22" height="24" rx="3" fill="#424242"/>
    <text x="-30" y="38" fill="#424242">after video</text>
  </g>
  <rect x="150" y="215" width="70" height="75" fill="none" stroke="#D55E00" stroke-width="2.5" stroke-dasharray="6 4"/>
  <line x1="612" y1="175" x2="43" y2="270" stroke="#D55E00" stroke-width="1.8"/>
  <circle cx="220" cy="240" r="5" fill="#D55E00"/>
  <text x="60" y="314" fill="#D55E00">free: the ray passes where the box was and hits the wall: evidence of absence</text>
  <rect x="300" y="120" width="60" height="40" fill="#bdbdbd"/>
  <line x1="612" y1="175" x2="362" y2="140" stroke="#2e7d32" stroke-width="1.8"/>
  <circle cx="360" cy="140" r="5" fill="#2e7d32"/>
  <text x="290" y="108" fill="#2e7d32">seen: depth agrees</text>
  <rect x="420" y="40" width="22" height="80" fill="#757575"/>
  <line x1="612" y1="175" x2="443" y2="109" stroke="#8a8a8a" stroke-width="1.8"/>
  <line x1="420" y1="100" x2="345" y2="72" stroke="#8a8a8a" stroke-width="1.4" stroke-dasharray="3 4"/>
  <circle cx="340" cy="70" r="5" fill="#8a8a8a"/>
  <text x="200" y="40" fill="#616161">occluded: something nearer hides it</text>
  <circle cx="575" cy="40" r="5" fill="#8a8a8a"/>
  <text x="470" y="22" fill="#616161">unreached: outside every frame</text>
  <text x="60" y="334" fill="#424242" font-size="12">Dots: surfaces the before video saw. Occluded and unreached carry no information.</text>
