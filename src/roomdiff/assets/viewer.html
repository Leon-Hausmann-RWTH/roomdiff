<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>roomdiff viewer</title>
<style>
  :root { --bg: #f6f5f2; --panel: #fff; --ink: #1d1d1f; --muted: #6b6b70; --line: #e2e0db;
          --unverified: #8A8A8A; --before: #009E73; --after: #E69F00; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  #app { display: flex; height: 100%; }
  #view { flex: 1; position: relative; min-width: 0; touch-action: none; }
  #view canvas { display: block; }
  #panel { width: 390px; background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; padding: 16px; }
  h1 { font-size: 17px; margin: 0 0 4px; }
  h2 { font-size: 12px; margin: 18px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  p { margin: 0 0 10px; }
  .sub { color: var(--muted); font-size: 13px; }
  button { font: inherit; cursor: pointer; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 4px 10px; color: var(--ink); }
  .modes { display: flex; gap: 4px; margin-bottom: 6px; }
  .modes button { flex: 1; padding: 5px 0; }
  .modes button.on { background: var(--ink); color: #fff; border-color: var(--ink); }
  .hint { color: var(--muted); font-size: 12px; margin-bottom: 10px; min-height: 18px; }
  .edit { display: flex; align-items: center; gap: 8px; }
  .edit input { flex: 1; accent-color: var(--ink); }
  #play { width: 36px; padding: 4px 0; }
  #editval { width: 42px; text-align: right; font-variant-numeric: tabular-nums; font-size: 13px; }
  .toggles { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; margin: 8px 0 4px; }
  .item { border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; margin-bottom: 8px; cursor: pointer; }
  .item:hover { border-color: var(--muted); }
  .item.unverified { border-style: dashed; border-color: var(--unverified); }
  .item.sel { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
  .tag { display: inline-flex; align-items: center; justify-content: center; gap: 3px; min-width: 24px; height: 20px; padding: 0 6px;
         border-radius: 4px; color: #fff; font-weight: 700; font-size: 13px; margin-right: 6px; vertical-align: 1px; }
  .st { color: var(--muted); font-size: 12px; margin-left: 4px; }
  .sent { margin: 4px 0 2px; }
  .reason { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
  .bar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; background: #eee; }
  .bar i { display: block; height: 100%; }
  .barlab { color: var(--muted); font-size: 11px; margin-top: 3px; }
  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 8px; }
  .cards figure { margin: 0; }
  .cards img { width: 100%; display: block; border-radius: 4px; cursor: zoom-in; }
  .cards figcaption { font-size: 11px; color: var(--muted); }
  .cards .none { aspect-ratio: 4 / 3; display: flex; align-items: center; justify-content: center; background: #f0efeb;
                 border-radius: 4px; color: var(--muted); font-size: 11px; }
  #legend { position: absolute; left: 10px; bottom: 10px; background: rgba(255, 255, 255, .92); border: 1px solid var(--line);
            border-radius: 8px; padding: 6px 10px; font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 12px; max-width: calc(100% - 20px); }
  #legend .tag { height: 16px; min-width: 18px; font-size: 11px; margin-right: 3px; padding: 0 4px; }
  #legend .sw { display: inline-block; width: 12px; height: 12px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
  #progress { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--ink); opacity: .4; display: none; }
  #lightbox { position: fixed; inset: 0; background: rgba(0, 0, 0, .82); display: none; align-items: center; justify-content: center;
              z-index: 9; cursor: zoom-out; }
  #lightbox img { max-width: 94vw; max-height: 90vh; }
  @media (max-width: 760px) {
    #app { flex-direction: column; }
    #view { flex: none; height: 50vh; }
    #panel { width: 100%; flex: 1; border-left: 0; border-top: 1px solid var(--line); padding: 12px 16px; }
    #legend { font-size: 11px; left: 6px; bottom: 6px; padding: 4px 8px; gap: 2px 10px; }
  }
</style>
</head>
<body>
<div id="app">
  <div id="view"><div id="legend"></div><div id="progress"></div></div>
  <div id="panel">
    <h1>What changed in the room</h1>
    <p class="sub" id="summary"></p>
    <p class="sub" id="define">Unverified means not enough evidence either way: the other video saw too little of it, part of it is still there, or it is too flat to tell from the surface under it.</p>
    <div class="modes" id="modes"></div>
    <div class="hint" id="hint"></div>
    <div class="edit">
      <button id="play" title="Play the edits">&#9654;</button>
      <input id="edit" type="range" min="0" max="1" step="0.01" value="0" aria-label="Share of the detected edits applied to the before scene">
      <span id="editval">0 %</span>
    </div>
    <div class="hint">Slider: the detected edits applied to the before scene, from none to all.</div>
    <div class="toggles">
      <label><input type="checkbox" id="showUnchecked"> areas not checked</label>
      <label><input type="checkbox" id="showPaths"> camera paths</label>
      <label><input type="checkbox" id="showFilm"> where to film next</label>
    </div>
    <h2>Changes</h2>
    <div id="list"></div>
    <h2>Coverage</h2>
    <p class="sub" id="coverage"></p>
  </div>
</div>
<div id="lightbox"><img alt="evidence card"></div>
<script>/*THREE*/</script>
<script>/*ORBIT*/</script>
<script>
const DATA = /*DATA*/;
const R = DATA.result;
const STYLE = { removed: ['#D55E00', '−'], added: ['#0072B2', '+'], moved: ['#CC79A7', '→'], unverified: ['#8A8A8A', '?'] };
const VIDEO = { before: '#009E73', after: '#E69F00' };
const SIDES = ['before', 'after'];
const HINTS = {
  Before: 'Before video in its own colours. Move the slider to apply the detected edits.',
  After: 'After video in its own colours. Boxes without points mark places that are now empty.',
  Overlay: 'Both videos: before in green, after in amber.',
  Changes: 'Unchanged points in grey, changed objects in the colour of their change; the old place of a moved object is pale.',
};
const kindOf = c => c.status === 'unverified' ? 'unverified' : c.type;
// Halves round to even as in Python, so the panel prints the same numbers as report.md and the reasons.
const round = v => { const r = Math.round(v); return r - v === 0.5 && r % 2 ? r - 1 : r; };
const pct = x => round(100 * x) + ' %';
const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[ch]);
const $ = id => document.getElementById(id);
const tagHtml = (k, text) => `<span class="tag" style="background:${STYLE[k][0]}">${STYLE[k][1]}${text === '' ? '' : ' ' + text}</span>`;

function decode(b64, Type) {
  const bin = atob(b64), bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new Type(bytes.buffer);
}

const view = $('view');
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
view.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0xf6f5f2);
const camera = new THREE.PerspectiveCamera(50, 1, 0.05, 100);
camera.up.set(0, 0, 1);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function points(xyz, rgb, st, size) {
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(xyz, 3));
  g.setAttribute('color', new THREE.BufferAttribute(rgb.slice(), 3));
  const p = new THREE.Points(g, new THREE.PointsMaterial({ size, vertexColors: true, transparent: true }));
  p.userData.rgb = rgb;
  p.userData.st = st;
  return p;
}

// One point set for the unchanged points of a video and one per change id, so each can fade or move on its own.
function split(part) {
  const xyz = decode(part.xyz, Float32Array), rgb = decode(part.rgb, Uint8Array), cid = decode(part.cid, Int16Array);
  const st = decode(part.st, Uint8Array);
  const groups = new Map();
  cid.forEach((id, i) => { if (!groups.has(id)) groups.set(id, []); groups.get(id).push(i); });
  const out = new Map();
  groups.forEach((idx, id) => {
    const p = new Float32Array(idx.length * 3), c = new Float32Array(idx.length * 3), s = Uint8Array.from(idx, i => st[i]);
    idx.forEach((i, j) => { for (let k = 0; k < 3; k++) { p[3 * j + k] = xyz[3 * i + k]; c[3 * j + k] = rgb[3 * i + k] / 255; } });
    // Three.js scales point size by half the view height, not the focal length; 0.04 covers a 2 cm voxel at 50 degrees.
    out.set(id, points(p, c, s, id < 0 ? 0.036 : 0.044));
  });
  return out;
}

// Points the other video could not check: seen in fewer than three of its frames (per video, as in the top view),
// or hidden from it behind something nearer.
const UNCHECKED = { before: [0.42, 0.8, 0.66], after: [0.96, 0.74, 0.3] }, HIDDEN = [0.66, 0.56, 0.92];
function paint(p, f, tint, side) {
  const src = p.userData.rgb, st = p.userData.st, dst = p.geometry.attributes.color.array;
  for (let i = 0; i < src.length; i += 3) {
    let o = f(src[i], src[i + 1], src[i + 2], 0.3 * src[i] + 0.59 * src[i + 1] + 0.11 * src[i + 2]);
    const t = !tint ? null : st[i / 3] === 3 ? UNCHECKED[side] : st[i / 3] === 2 ? HIDDEN : null;
    if (t) o = o.map((x, k) => 0.35 * x + 0.65 * t[k]);
    dst[i] = o[0]; dst[i + 1] = o[1]; dst[i + 2] = o[2];
  }
  p.geometry.attributes.color.needsUpdate = true;
}
const asIs = (r, g, b) => [r, g, b];
const dim = (r, g, b, l) => { const v = 0.62 + 0.26 * l; return [v, v, v]; };
const shaded = hex => { const c = new THREE.Color(hex); return (r, g, b, l) => [c.r, c.g, c.b].map(x => Math.min(1, x * (0.55 + 0.6 * l))); };

function place(o, b) { o.position.set(...b.center); o.rotation.z = b.yaw; return o; }
function edges(b, color, dashed) {
  const mat = dashed ? new THREE.LineDashedMaterial({ color, dashSize: 0.04, gapSize: 0.03, transparent: true })
                     : new THREE.LineBasicMaterial({ color, transparent: true });
  const l = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.BoxGeometry(...b.size)), mat);
  if (dashed) l.computeLineDistances();
  return place(l, b);
}
function fill(b, color, opacity) {
  const mat = new THREE.MeshBasicMaterial({ color, transparent: true, opacity, depthWrite: false });
  return place(new THREE.Mesh(new THREE.BoxGeometry(...b.size), mat), b);
}
// A tag that keeps its size on screen and stays visible through points, sitting on top of its box.
// Ghost cameras get an outlined tag so they do not read as changes.
function label(text, color, b, outlined) {
  const cv = document.createElement('canvas'), ctx = cv.getContext('2d'), font = 'bold 40px -apple-system, "Segoe UI", Roboto, sans-serif';
  ctx.font = font;
  cv.width = Math.ceil(ctx.measureText(text).width) + 28; cv.height = 60;
  ctx.font = font; ctx.fillStyle = outlined ? 'rgba(255, 255, 255, 0.9)' : color; ctx.strokeStyle = color; ctx.lineWidth = 4;
  ctx.setLineDash([8, 5]);
  ctx.beginPath(); ctx.roundRect(2, 2, cv.width - 4, cv.height - 4, 12); ctx.fill();
  if (outlined) ctx.stroke();
  ctx.fillStyle = outlined ? color : '#fff'; ctx.textBaseline = 'middle'; ctx.fillText(text, 14, 32);
  const mat = new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(cv), depthTest: false, transparent: true, sizeAttenuation: false });
  const s = new THREE.Sprite(mat);
  s.scale.set(0.042 * cv.width / cv.height, 0.042, 1);
  s.center.set(0.5, -0.2);
  s.renderOrder = 10;
  s.position.set(b.center[0], b.center[1], b.center[2] + b.size[2] / 2);
  return s;
}

const clouds = { before: split(DATA.clouds.before), after: split(DATA.clouds.after) };
const statics = SIDES.map(s => clouds[s].get(-1));
// After points on surfaces that a departed object hid in the before video.
const revealed = clouds.after.get(-2);
[...statics, revealed].filter(Boolean).forEach(p => scene.add(p));

const items = R.changes.map(c => {
  const k = kindOf(c), color = STYLE[k][0], o = { c, k, color };
  for (const side of SIDES) {
    const b = c['box_' + side];
    if (!b) continue;
    // Unverified edges are darker than their grey tag: dashed grey lines vanish on grey furniture.
    const g = new THREE.Group(), pts = clouds[side].get(c.id), f = fill(b, color, 0.3);
    const e = k === 'unverified' ? edges(b, '#3f3f44', true) : edges(b, color, false);
    const tag = label(`${STYLE[k][1]} ${c.id}`, color, b);
    if (pts) g.add(pts);
    g.add(e, f, tag);
    scene.add(g);
    o[side] = { g, pts, e, f, tag };
  }
  if (c.type === 'moved') {
    const a = new THREE.Vector3(...c.box_before.center), b = new THREE.Vector3(...c.box_after.center);
    const lift = Math.max(c.box_before.size[2], c.box_after.size[2]) / 2 + 0.05;
    a.z += lift; b.z += lift;
    const len = a.distanceTo(b);
    // Darker than the object's points so the head stays visible where it lands on them. Drawn over the scene:
    // transparent objects come after the (transparent) points, and renderOrder keeps it under the tags.
    o.arrow = new THREE.ArrowHelper(b.clone().sub(a).normalize(), a, len, 0x8f3f6f, Math.min(0.12, len / 3), Math.min(0.07, len / 5));
    [o.arrow.line, o.arrow.cone].forEach(m => { m.material.depthTest = false; m.material.transparent = true; m.renderOrder = 9; });
    scene.add(o.arrow);
  }
  return o;
});

// A grey wireframe camera where filming would settle an unverified change, with a dashed sight line to the spot.
function ghostCamera(c) {
  const w = c.check_from, at = new THREE.Vector3(...w.look_at), g = new THREE.Group(), body = new THREE.Group();
  const q = [[-0.16, -0.1], [0.16, -0.1], [0.16, 0.1], [-0.16, 0.1]].map(([x, y]) => [x, y, 0.26]);
  const segs = q.flatMap((p, i) => [0, 0, 0, ...p, ...p, ...q[(i + 1) % 4]]);
  body.add(new THREE.LineSegments(new THREE.BufferGeometry().setAttribute('position', new THREE.Float32BufferAttribute(segs, 3)),
                                  new THREE.LineBasicMaterial({ color: 0x55555a })));
  body.position.set(...w.position);
  body.up.set(0, 0, 1);
  body.lookAt(at);
  const sight = new THREE.Line(new THREE.BufferGeometry().setFromPoints([body.position, at]),
                               new THREE.LineDashedMaterial({ color: 0x8a8a8a, dashSize: 0.05, gapSize: 0.04 }));
  sight.computeLineDistances();
  g.add(body, sight, label(`film ${c.id} here`, '#55555a', { center: w.position, size: [0, 0, 0.12] }, true));
  scene.add(g);
  return g;
}
items.forEach(o => { if (o.c.check_from) o.ghost = ghostCamera(o.c); });

const paths = new THREE.Group();
SIDES.forEach(side => {
  const pts = DATA.cameras[side].map(p => new THREE.Vector3(...p));
  const geo = new THREE.BufferGeometry().setFromPoints(pts);
  paths.add(new THREE.Line(geo, new THREE.LineBasicMaterial({ color: VIDEO[side] })));
  paths.add(new THREE.Points(geo, new THREE.PointsMaterial({ color: VIDEO[side], size: 0.04 })));
});
paths.visible = false;
scene.add(paths);

let mode = 'Changes', painted = null, edit = 0, selected = null, playing = false, playT0 = 0, fly = null;

function fade(obj, a) {
  if (!obj) return;
  obj.visible = a > 0.01;
  obj.material.opacity = a;
  obj.material.depthWrite = a > 0.99;
}

// Spin about the object's own centre while that centre travels in a straight line; at s = 1 this is p_after = Rz(yaw) p + t.
function moveTo(o, s) {
  const tr = o.c.transform, p = o.c.box_before.center, g = o.before.g;
  const cy = Math.cos(tr.yaw), sy = Math.sin(tr.yaw);
  const end = [cy * p[0] - sy * p[1] + tr.t[0], sy * p[0] + cy * p[1] + tr.t[1], p[2] + tr.t[2]];
  const yaw = s * tr.yaw, c = Math.cos(yaw), sn = Math.sin(yaw);
  g.rotation.z = yaw;
  g.position.set(p[0] + s * (end[0] - p[0]) - (c * p[0] - sn * p[1]), p[1] + s * (end[1] - p[1]) - (sn * p[0] + c * p[1]), s * (end[2] - p[2]));
}

function repaint(key, tint) {
  painted = key;
  const object = (o, side) => mode === 'Overlay' ? shaded(VIDEO[side]) : mode === 'Changes' ? shaded(o.color) : asIs;
  const stat = side => mode === 'Overlay' ? shaded(VIDEO[side]) : mode === 'Changes' ? dim : asIs;
  [[statics[0], 'before'], [statics[1], 'after'], [revealed, 'after']].forEach(([p, side]) => p && paint(p, stat(side), tint, side));
  items.forEach(o => SIDES.forEach(side => o[side] && o[side].pts && paint(o[side].pts, object(o, side), tint, side)));
}

function apply() {
  const tint = $('showUnchecked').checked;
  if (painted !== mode + tint) repaint(mode + tint, tint);
  const s = edit;
  // A thin bar at the foot of the view shows how far the edits are applied, also in recordings of the view.
  $('progress').style.display = mode === 'Before' && s > 0 && s < 1 ? 'block' : 'none';
  $('progress').style.width = 100 * s + '%';
  statics[0].visible = mode !== 'After';
  statics[1].visible = mode !== 'Before';
  fade(revealed, mode === 'Before' ? s : 1);
  items.forEach(o => {
    const t = o.c.type, B = o.before, A = o.after;
    let pb = 1, eb = 1, pa = 1, ea = 1;
    if (mode === 'Before') {
      if (t === 'removed') { pb = 1 - s; eb = Math.max(0.3, 1 - s); }
      if (t === 'added') { pa = s; ea = Math.max(0.3, s); }
      // The rigid fit turns an object only about z; over the last quarter it hands over to the after points,
      // so the end state is the after scene even for an object that also tipped over.
      if (t === 'moved') { const k = Math.min(1, Math.max(0, (s - 0.75) / 0.25)); pb = eb = 1 - k; pa = ea = k; }
    } else if (mode === 'After') {
      pb = 0;
      eb = t === 'removed' ? 1 : 0.3;
    } else if (mode === 'Changes' && t === 'moved') {
      pb = 0.3; eb = 0.4;
    }
    if (t === 'moved') moveTo(o, mode === 'Before' ? s : 0);
    const focus = !selected || selected === o ? 1 : 0.3, sel = selected === o;
    [[B, pb, eb], [A, pa, ea]].forEach(([part, p, e]) => {
      if (!part) return;
      fade(part.pts, p);
      fade(part.e, sel ? 1 : e * focus);
      part.f.visible = sel;
      // The selected change draws over the points in front of it, so a flat object is not buried in its support.
      [part.e, part.f, part.pts].forEach(m => { if (m) { m.material.depthTest = !sel; m.renderOrder = sel ? 9 : 0; } });
    });
    // A move gets one tag, like the top view: on the object that travels, or on its new place in the after view.
    if (t === 'moved') { B.tag.visible = mode !== 'After'; A.tag.visible = mode === 'After'; }
  });
  paths.visible = $('showPaths').checked;
  items.forEach(o => { if (o.ghost) o.ghost.visible = $('showFilm').checked || selected === o; });
  legend();
}

function legend() {
  const kinds = ['removed', 'added', 'moved', 'unverified'].map(k => `<span>${tagHtml(k, '')}${k === 'unverified' ? 'unverified, dashed' : k}</span>`);
  const sw = c => `<i class="sw" style="background:rgb(${c.map(x => Math.round(255 * x)).join(',')})"></i>`;
  if ($('showUnchecked').checked) {
    SIDES.forEach(s => kinds.push(`<span>${sw(UNCHECKED[s])}${s} video: too few views from the other</span>`));
    kinds.push(`<span>${sw(HIDDEN)}hidden from the other video</span>`);
  }
  if (items.some(o => o.ghost && o.ghost.visible)) kinds.push('<span><i class="sw" style="border:2px solid #55555a"></i>grey camera: where to film next</span>');
  if (mode === 'Overlay' || paths.visible) SIDES.forEach(s => kinds.push(`<span><i class="sw" style="background:${VIDEO[s]}"></i>${s} video</span>`));
  // Rebuilt on every slider step while playing, so touch the DOM only when the content changes.
  const html = kinds.join('');
  if (legend.html !== html) $('legend').innerHTML = legend.html = html;
}

function setMode(name) {
  mode = name;
  [...$('modes').children].forEach(b => b.classList.toggle('on', b.textContent === name));
  $('hint').textContent = HINTS[name];
  apply();
}
Object.keys(HINTS).forEach(n => {
  const b = document.createElement('button');
  b.textContent = n;
  b.onclick = () => setMode(n);
  $('modes').appendChild(b);
});

function setEdit(s) {
  edit = s;
  $('edit').value = s;
  $('editval').textContent = pct(s);
  // The slider edits the before scene, so any other view switches to the before video.
  if (mode !== 'Before') setMode('Before'); else apply();
}
$('edit').oninput = e => { playing = false; $('play').innerHTML = '&#9654;'; setEdit(+e.target.value); };
$('play').onclick = () => {
  playing = !playing;
  $('play').innerHTML = playing ? '&#10074;&#10074;' : '&#9654;';
  playT0 = performance.now() - (edit > 0 ? 1100 + 2200 * edit : 0);
};
$('showUnchecked').onchange = apply;
$('showPaths').onchange = apply;
$('showFilm').onchange = apply;
$('showFilm').parentNode.hidden = !items.some(o => o.ghost);

function select(o) {
  selected = selected === o ? null : o;
  items.forEach(x => x.div.classList.toggle('sel', x === selected));
  apply();
  if (!selected) return;
  const boxes = [o.c.box_before, o.c.box_after].filter(Boolean), w = o.c.check_from;
  let centre = boxes.reduce((a, b) => a.add(new THREE.Vector3(...b.center)), new THREE.Vector3()).divideScalar(boxes.length);
  let r = Math.max(...boxes.map(b => Math.hypot(...b.size) / 2));
  if (boxes.length === 2) r += new THREE.Vector3(...boxes[0].center).distanceTo(new THREE.Vector3(...boxes[1].center)) / 2;
  const dir = camera.position.clone().sub(controls.target).normalize();
  dir.z = Math.max(dir.z, 0.6);
  dir.normalize();
  let eye = centre.clone().addScaledVector(dir, Math.max(1.8, 4 * r));
  if (w) {
    // Stand a little behind and above the ghost camera, so the view shows what filming from there would see.
    centre = new THREE.Vector3(...w.look_at);
    const back = new THREE.Vector3(...w.position).sub(centre);
    eye = centre.clone().addScaledVector(back, 1 + 0.9 / back.length()).add(new THREE.Vector3(0, 0, 0.5));
  }
  fly = { t0: performance.now(), p0: camera.position.clone(), q0: controls.target.clone(), q1: centre, p1: eye };
}

const C = R.counts, n = C.moved + C.added + C.removed;
const parts = ['moved', 'added', 'removed'].filter(t => C[t]).map(t => `${C[t]} ${t}`).join(', ');
const unv = C.unverified ? `; ${C.unverified} of them unverified` : '';
$('summary').textContent = n ? `${n} change${n === 1 ? '' : 's'} between ${R.before} and ${R.after}: ${parts}${unv}.`
                             : `No changes between ${R.before} and ${R.after}.`;
$('define').hidden = !C.unverified;

const BAR = [['free', null, 'looked through'], ['seen', '#3a3a3c', 'surface seen'], ['occluded', '#b5b3ad', 'hidden'], ['unreached', '#e4e2dd', 'too few views']];
items.forEach(o => {
  const c = o.c, e = c.evidence, cards = DATA.cards[c.id] || {}, div = document.createElement('div');
  div.className = 'item ' + o.k;
  div.innerHTML =
    `<div>${tagHtml(o.k, c.id)}<b>${esc(c.title)}</b><span class="st">${c.type}, ${c.status}</span></div>` +
    `<div class="sent">${esc(c.sentence)}</div><div class="reason">${esc(c.reason)}</div>` +
    (c.check_from ? `<div class="reason">Film again from where the ${c.check_from.video} video stood at ` +
                    `${c.check_from.time_s.toFixed(1)} s (grey camera in the view).</div>` : '') +
    `<div class="bar">${BAR.map(([k, col]) => `<i style="width:${100 * e[k]}%;background:${col || o.color}"></i>`).join('')}</div>` +
    `<div class="barlab">${e.points.toLocaleString('en-US')} points: ` +
    `${BAR.filter(([k]) => round(100 * e[k])).map(([k, , name]) => `${pct(e[k])} ${name}`).join(', ')}</div>` +
    `<div class="cards">${SIDES.map(s => `<figure>${cards[s] ? `<img src="${cards[s]}" alt="${s} video">` : `<div class="none">no ${s} view</div>`}` +
                                         `<figcaption>${s}</figcaption></figure>`).join('')}</div>`;
  div.onclick = () => select(o);
  div.querySelectorAll('img').forEach(img => { img.onclick = ev => { ev.stopPropagation(); $('lightbox').firstChild.src = img.src; $('lightbox').style.display = 'flex'; }; });
  $('list').appendChild(div);
  o.div = div;
});
$('lightbox').onclick = () => { $('lightbox').style.display = 'none'; };
const cov = R.coverage;
$('coverage').textContent = `The other video checked ${pct(cov.checked)} of all surface points and had ${pct(cov.hidden)} hidden; ` +
                            `it saw ${pct(cov.unchecked_before)} (before video) and ${pct(cov.unchecked_after)} (after video) in fewer than three frames. ` +
                            '"areas not checked" tints both kinds.';

const c0 = DATA.center, r0 = DATA.radius;
controls.target.set(c0[0], c0[1], c0[2] - 0.2);
camera.position.set(c0[0] + 0.4 * r0, c0[1] - 0.45 * r0, c0[2] + 0.62 * r0);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();
setMode('Changes');

(function loop(now) {
  requestAnimationFrame(loop);
  if (fly) {
    const t = Math.min(1, (now - fly.t0) / 800), e = t * t * (3 - 2 * t);
    camera.position.lerpVectors(fly.p0, fly.p1, e);
    controls.target.lerpVectors(fly.q0, fly.q1, e);
    if (t === 1) fly = null;
  }
  if (playing) {
    // One cycle: hold the before scene, apply the edits, hold, undo them; 6.6 s in all.
    const t = ((now - playT0) / 1000) % 6.6, ramp = x => x * x * (3 - 2 * x);
    setEdit(t < 1.1 ? 0 : t < 3.3 ? ramp((t - 1.1) / 2.2) : t < 4.4 ? 1 : ramp(1 - (t - 4.4) / 2.2));
  }
  controls.update();
  renderer.render(scene, camera);
})(performance.now());
</script>
</body>
</html>
